<h2>Available Courses</h2>

<input
  type="text"
  placeholder="Search courses"
  [(ngModel)]="searchTerm">

<button (click)="searchCourses()">
  Search
</button>

<br><br>

<div *ngIf="courses$ | async as courses">

  <div
    *ngFor="let course of courses; trackBy: trackByCourseId">

    <app-course-card
      [course]="course"
      (click)="viewCourse(course.id)">
    </app-course-card>

    <br>

  </div>

</div>

<ng-template #noCourses>
  <p>No courses available.</p>
</ng-template>
