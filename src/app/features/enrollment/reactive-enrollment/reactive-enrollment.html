<h2>Reactive Enrollment Form</h2>

<form
[formGroup]="enrollForm"
(ngSubmit)="onSubmit()">

<label>Student Name</label>

<input
type="text"
formControlName="studentName">

<div *ngIf="enrollForm.get('studentName')?.touched">

<span
*ngIf="enrollForm.get('studentName')?.errors?.['required']">

Name is required

</span>

<span
*ngIf="enrollForm.get('studentName')?.errors?.['minlength']">

Minimum 3 characters

</span>

</div>

<br><br>

<label>Email</label>

<input
type="email"
formControlName="studentEmail">

<div *ngIf="enrollForm.get('studentEmail')?.pending">

Checking email...

</div>

<div *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">

Email already taken

</div>

<br><br>

<label>Course ID</label>

<input
type="text"
formControlName="courseId">

<div *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">

Course code starting with XX is not allowed.

</div>

<br><br>

<label>Preferred Semester</label>

<select formControlName="preferredSemester">

<option value="">Select</option>
<option>Odd</option>
<option>Even</option>

</select>

<br><br>

<h3>Additional Courses</h3>

<button
type="button"
(click)="addCourse()">

Add Another Course

</button>

<br><br>

<div *ngFor="let ctrl of additionalCourses.controls; let i = index">

    <input
        [formControl]="ctrl">

    <button
        type="button"
        (click)="removeCourse(i)">
        Remove
    </button>

</div>

<br>

<button
type="submit"
[disabled]="enrollForm.invalid">

Submit

</button>

</form>

<div *ngIf="submitted">

<h3>

Reactive Form Submitted Successfully!

</h3>

</div>
