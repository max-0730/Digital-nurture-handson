<h1>{{ portalName }}</h1>

<p>Welcome to the Student Course Portal.</p>

<p>Available Courses : {{ coursesAvailable }}</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">

  Enroll Now

</button>

<p>{{ message }}</p>

<br>

<input
  type="text"
  placeholder="Search Courses"
  [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>

<div class="stats">

    <div class="card">
        <h2>{{ coursesAvailable }}</h2>
        <p>Courses Available</p>
    </div>

    <div class="card">
        <h2>3</h2>
        <p>Enrolled</p>
    </div>

    <div class="card">
        <h2>3.8</h2>
        <p>GPA</p>
    </div>

</div>

<app-course-summary-widget></app-course-summary-widget>

<br>

<button (click)="addDummyCourse()">

  Add Dummy Course

</button>
